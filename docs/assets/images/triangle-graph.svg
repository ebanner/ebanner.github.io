<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <!-- Edges -->
  <line x1="150" y1="40"  x2="60"  y2="200" stroke="#333" stroke-width="2"/>
  <line x1="60"  y1="200" x2="240" y2="200" stroke="#333" stroke-width="2"/>
  <line x1="150" y1="40"  x2="240" y2="200" stroke="#333" stroke-width="2"/>

  <!-- Nodes -->
  <circle cx="150" cy="40"  r="24" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="60"  cy="200" r="24" fill="white" stroke="#333" stroke-width="2"/>
  <circle cx="240" cy="200" r="24" fill="white" stroke="#333" stroke-width="2"/>

  <!-- Labels -->
  <text x="150" y="46"  text-anchor="middle" font-size="18">A</text>
  <text x="60"  y="206" text-anchor="middle" font-size="18">B</text>
  <text x="240" y="206" text-anchor="middle" font-size="18">C</text>
</svg>
